<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水水的看板入口</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    display:flex;align-items:center;justify-content:center;min-height:100vh;
    background:linear-gradient(135deg,#e8edf2 0%,#d5dce4 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .container{text-align:center;padding:40px}
  h1{font-size:28px;font-weight:700;color:#1a1a2e;margin-bottom:8px;letter-spacing:-0.5px}
  .sub{font-size:14px;color:#6b7280;margin-bottom:48px}
  .cards{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
  .card{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    width:280px;height:200px;border-radius:16px;cursor:pointer;
    text-decoration:none;transition:all .25s ease;
    box-shadow:0 2px 12px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.04);
    position:relative;overflow:hidden;
  }
  .card:hover{transform:translateY(-4px);box-shadow:0 8px 28px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.06)}
  .card::before{
    content:'';position:absolute;top:0;left:0;right:0;bottom:0;
    opacity:0;transition:opacity .25s ease;
    background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);
  }
  .card:hover::before{opacity:1}
  .card-data{background:#fff}
  .card-task{background:#fff}
  .icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;font-size:28px}
  .card-data .icon{background:#eef2ff;color:#4f46e5}
  .card-task .icon{background:#fef3c7;color:#d97706}
  .card-title{font-size:18px;font-weight:700;color:#1a1a2e;margin-bottom:4px}
  .card-desc{font-size:13px;color:#9ca3af}
  .card-badge{
    position:absolute;top:16px;right:16px;
    font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;
  }
  .card-data .card-badge{background:#eef2ff;color:#6366f1}
  .card-task .card-badge{background:#fef3c7;color:#b45309}
  .tip{
    margin-top:48px;font-size:13px;color:#9ca3af;line-height:1.8;
    background:rgba(255,255,255,.5);padding:16px 24px;border-radius:12px;display:inline-block;
  }
  .tip kbd{
    background:#e5e7eb;color:#374151;padding:2px 7px;border-radius:4px;
    font-size:12px;font-family:inherit;border:1px solid #d1d5db;
  }
  @media (max-width:640px){
    .cards{flex-direction:column;align-items:center}
    .card{width:260px;height:170px}
    h1{font-size:22px}
  }
</style>
</head>
<body>
<script>
function openFile(path) {
  var w = window.open('file://' + path, '_blank');
  if (!w) {
    // fallback: open in same tab
    window.location.href = 'file://' + path;
  } else {
    w.focus();
  }
}
</script>
<div class="container">
  <h1>水水的看板入口</h1>
  <p class="sub">数据看板 · 任务系统</p>
  <div class="cards">
    <div class="card card-data" onclick="openFile('/Users/wushui/WorkBuddy/Dashboard/index.html')">
      <span class="card-badge">数据</span>
      <div class="icon">📊</div>
      <div class="card-title">0元课前总览看板</div>
      <div class="card-desc">5渠道 leads 数据运营</div>
    </div>
    <div class="card card-task" onclick="openFile('/Users/wushui/WorkBuddy/2026-07-03-14-57-00/进校增长-任务看板.html')">
      <span class="card-badge">任务</span>
      <div class="icon">📋</div>
      <div class="card-title">进校增长 · 任务看板</div>
      <div class="card-desc">团队协作 & 番茄钟</div>
    </div>
  </div>
  <p class="tip">
    💡 提示：打开后按 <kbd>⌘D</kbd> 加入书签，下次一键直达<br>
    或把两个看板标签页 <strong>固定</strong>（右键标签 → 固定），浏览器重启后依然在
  </p>
</div>
</body>
</html>
